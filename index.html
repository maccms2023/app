<!doctype html>
<!--
  文件: index.html
  说明: 页面会自动跳转到默认目标。默认目标在脚本中设置为 https://www.example.com/。
  可通过在 URL 后添加 ?to=<目标网址> 来指定跳转目标，例如:
  https://cdn.jsdelivr.net/gh/maccms2023/app@main/index.html?to=https%3A%2F%2Fwww.baidu.com%2F
  或直接把脚本中的 defaultTarget 改为你想要的 URL。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>页面跳转</title>
  <meta http-equiv="refresh" content="0; url=https://www.baidu.com/">
  <script>
    (function(){
      // 默认跳转目标（请改为你的目标 URL）
      var defaultTarget = "https://www.baidu.com/";
      try {
        var params = new URLSearchParams(location.search);
        var target = params.get('to') || defaultTarget;
        // 简单校验，确保以 http 或 https 开头
        if (!/^https?:\/\//i.test(target)) target = defaultTarget;
        // 使用 location.replace 替换历史记录（更干净的跳转）
        location.replace(target);
      } catch (e) {
        // 如果出错，退回到 meta refresh 的默认目标
        console.error(e);
      }
    })();
  </script>
</head>
<body>
  <p>正在跳转... 如果没有自动跳转，请点击：
    <a id="link" href="https://www.example.com/">前往目标</a>
  </p>
</body>
</html>
